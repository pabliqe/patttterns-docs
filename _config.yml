title: PATTTTERNS Docs
description: Internal documentation and roadmaps for the PATTTTERNS design pattern library.
remote_theme: just-the-docs/just-the-docs
# Color scheme supports "light" (default) and "dark"
color_scheme: dark
search_enabled: true
logo: "/assets/img/logo.png"

# Custom CSS — matches PATTTTERNS brand (brand.json + DESIGN.md)
custom_css:
  - assets/css/custom.scss
sass:
  style: compressed

# Navigation order in sidebar
nav_sort: case_insensitive

# Footer
footer_content: '© 2026 <a href="https://patttterns.com">PATTTTERNS</a>'

exclude:
  - "*.sql"
  - ".archive/"
